<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="Схема окна контроля учётных записей: Разрешить этому приложению вносить изменения на вашем устройстве? Нажмите Да">
  <rect x="10" y="10" width="740" height="240" fill="#f0f0f0" stroke="#999"/>
  <rect x="10" y="10" width="740" height="56" fill="#2b2b2b"/>
  <g font-family="Segoe UI, Arial">
    <text x="40" y="46" font-size="20" fill="#fff">Контроль учётных записей</text>
    <text x="40" y="104" font-size="22" fill="#222">Разрешить этому приложению вносить изменения</text>
    <text x="40" y="132" font-size="22" fill="#222">на вашем устройстве?</text>
    <text x="40" y="170" font-size="18" fill="#555">Кладезъ-установка.exe · Издатель: неизвестно</text>
    <rect x="360" y="192" width="170" height="44" fill="#2b6cb0"/>

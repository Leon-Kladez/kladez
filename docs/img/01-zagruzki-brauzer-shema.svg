<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="Схема списка загрузок браузера: нажмите на три точки рядом с файлом и выберите Сохранить">
  <rect x="10" y="10" width="740" height="180" fill="#f3f3f3" stroke="#ccc"/>
  <g font-family="Segoe UI, Arial">
    <text x="40" y="50" font-size="20" fill="#333">Загрузки</text>
    <rect x="30" y="70" width="560" height="70" fill="#fff" stroke="#ccc"/>
    <text x="50" y="100" font-size="19" fill="#333">Кладезъ-установка.exe</text>
    <text x="50" y="126" font-size="16" fill="#b00">Этот файл редко скачивают</text>
    <text x="560" y="112" font-size="26" fill="#333">…</text>
    <circle cx="566" cy="104" r="22" fill="none" stroke="#d9a441" stroke-width="4"/>
    <rect x="600" y="80" width="140" height="44" fill="#fff" stroke="#d9a441" stroke-width="4"/>
    <text x="670" y="109" font-size="19" text-anchor="middle" fill="#333">Сохранить</text>
  </g>
</svg>
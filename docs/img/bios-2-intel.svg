<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Схема экрана BIOS для процессора Intel: раздел Advanced, строка Intel Virtualization Technology, значение нужно поменять на Enabled">
  <rect x="10" y="10" width="740" height="310" fill="#0b2a6b"/>
  <rect x="10" y="10" width="740" height="44" fill="#ccd6f0"/>
  <g font-family="Consolas, monospace" font-size="20">
    <text x="30" y="40" fill="#0b2a6b">Main</text>
    <rect x="110" y="16" width="120" height="32" fill="#0b2a6b"/><text x="122" y="40" fill="#fff">Advanced</text>
    <text x="260" y="40" fill="#0b2a6b">Boot</text><text x="340" y="40" fill="#0b2a6b">Security</text><text x="470" y="40" fill="#0b2a6b">Save &amp; Exit</text>
    <text x="40" y="100" fill="#ccd6f0">CPU Configuration</text>
    <text x="40" y="140" fill="#ccd6f0">Hyper-Threading</text><text x="520" y="140" fill="#ccd6f0">[Enabled]</text>
    <rect x="28" y="160" width="704" height="38" fill="#ffd34d"/>
    <text x="40" y="186" fill="#000" font-weight="bold">Intel Virtualization Technology</text><text x="520" y="186" fill="#000" font-weight="bold">[Disabled]</text>
    <text x="40" y="232" fill="#ccd6f0">Execute Disable Bit</text><text x="520" y="232" fill="#ccd6f0">[Enabled]</text>
  </g>
  <text x="380" y="295" fill="#ffd34d" font-size="22" text-anchor="middle" font-family="Segoe UI, Arial">Выберите эту строку и поменяйте Disabled на Enabled</text>
</svg>
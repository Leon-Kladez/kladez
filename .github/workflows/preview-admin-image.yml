name: Пробный образ панели

# Собирает образ панели «Кладезъ» из текущего кода и выкладывает его архивом,
# чтобы посмотреть программу на компьютере без доступа к реестрам образов.
on:
  workflow_dispatch:
  push:
    tags: ['preview-*']

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Номер пробной сборки: последняя версия установщика + имя метки, например «0.1.5-preview-3».
      - name: Номер версии
        run: |
          base=$(git describe --tags --abbrev=0 --match 'installer-v*' 2>/dev/null || echo installer-v0.0.0)
          echo "VERSION=${base#installer-v}-${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Сборка образа
        run: docker build -t kladez-admin:preview --build-arg VERSION="${VERSION}" .

      - name: Архив образа
        run: |
          mkdir -p dist
          docker save kladez-admin:preview | gzip -1 > dist/kladez-admin-preview.tar.gz
          sha256sum dist/kladez-admin-preview.tar.gz > dist/kladez-admin-preview.sha256
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: kladez-admin-preview
          path: dist/
          retention-days: 1
          compression-level: 0

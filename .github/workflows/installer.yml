# «Кладезъ»: сборка установщика для Windows (план части 5, Задача 11).
# Запуск вручную (Actions → «Установщик Кладезъ» → Run workflow) или тегом installer-v<версия>.
name: Установщик Кладезъ

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия установщика (например, 0.1.0)'
        required: true
        default: '0.1.0'
      update_file:
        description: 'Собрать и файл обновления без интернета (ещё ~1 ГБ в хранилище артефактов)'
        type: boolean
        default: false
  push:
    tags: ['installer-v*']

permissions:
  contents: read

jobs:
  linux:
    name: Linux — дистрибутив и образы
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Версия вычисляется один раз здесь и передаётся в Windows-задание как output:
      # PowerShell 5.1 пишет GITHUB_ENV с BOM, и там префикс installer-v не снимался (M6).
      - name: Версия без префикса
        id: version
        env:
          RAW: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          v="${RAW#installer-v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Неверная версия: $RAW" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      # Каждая версия должна быть записана в «Что нового» (справка, ru и en): полоса с датой
      # и номером — {% release date="…" versions="…, 0.1.N" %}. Без записи сборка не идёт.
      - name: Версия есть в «Что нового»
        run: |
          for f in admin/docs/ru/release-notes.md admin/docs/en/release-notes.md; do
            grep -qE "versions=\"[^\"]*\\b${VERSION//./\\.}\\b" "$f" || {
              echo "::error file=$f::Версии ${VERSION} нет в «Что нового» — добавьте запись {% release %} сверху"; exit 1; }
          done

      - name: Тесты bash (bats)
        run: |
          sudo apt-get update && sudo apt-get install -y bats zstd
          bats installer/linux/tests/update_watcher.bats installer/linux/tests/compose_template.bats \
               installer/linux/tests/kladez_start.bats

      # admin и updater собираются из этого репозитория (в updater — наш адрес реестра);
      # в images.lock для них стоят нули вместо отпечатка: настоящий Id подставляется здесь.
      - name: Образы admin и updater из этого репозитория
        run: |
          # VERSION — номер в подвале панели («Кладезъ 0.1.5»); без него образ показывал бы «dev».
          docker build --build-arg VERSION="${VERSION}" -t "ghcr.io/leon-kladez/kladez:${VERSION}" .
          docker build -t "ghcr.io/leon-kladez/kladez-sidecar-updater:${VERSION}" install/sidecar-updater
          id=$(docker image inspect -f '{{.Id}}' "ghcr.io/leon-kladez/kladez:${VERSION}")
          uid=$(docker image inspect -f '{{.Id}}' "ghcr.io/leon-kladez/kladez-sidecar-updater:${VERSION}")
          sed -i -e "s|^admin .*|admin ghcr.io/leon-kladez/kladez:${VERSION}@${id}|"                  -e "s|^updater .*|updater ghcr.io/leon-kladez/kladez-sidecar-updater:${VERSION}@${uid}|" installer/linux/images.lock
          cat installer/linux/images.lock
          # The Windows job packs images.lock into the update payload (payload\linux): it must get
          # this patched copy, not the placeholder from git (0.1.0 + zeros) — otherwise an update
          # renders compose with images that do not exist («No such image: …:0.1.0»).
          mkdir -p dist && cp installer/linux/images.lock dist/images.lock

      - name: Набор образов
        run: installer/linux/build-images-bundle.sh

      - name: Дистрибутив Kladez
        run: installer/linux/build-rootfs.sh

      - name: Проверка дистрибутива и набора
        run: bats installer/linux/tests/rootfs.bats

      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/kladez-rootfs.tar.gz
            dist/kladez-rootfs.sha256
            dist/kladez-images.tar.zst
            dist/kladez-images.sha256
            dist/images.lock
          retention-days: 1

  windows:
    name: Windows — тесты и установщик
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write   # удалить промежуточный артефакт linux-dist после скачивания
    env:
      VERSION: ${{ needs.linux.outputs.version }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: dist

      - name: Настоящий images.lock в установщик и обновление
        run: |
          if (-not (Test-Path dist/images.lock)) { throw 'dist/images.lock missing from linux-dist' }
          Copy-Item dist/images.lock installer/linux/images.lock -Force
          Get-Content installer/linux/images.lock
          if (Select-String -Path installer/linux/images.lock -Pattern 'sha256:0{64}' -Quiet) { throw 'images.lock still has placeholder digests' }

      # Хранилище артефактов ограничено (~2 ГБ): linux-dist (~1 ГБ) больше не нужен,
      # удаляем его сразу, чтобы поместился установщик (~1,5–1,8 ГБ). Без сторонних actions.
      - name: Удалить промежуточный артефакт linux-dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions"
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $list = Invoke-RestMethod -Headers $h -Uri "$api/runs/$env:GITHUB_RUN_ID/artifacts?name=linux-dist"
          foreach ($a in $list.artifacts) {
            Invoke-RestMethod -Method Delete -Headers $h -Uri "$api/artifacts/$($a.id)"
            Write-Output "Deleted artifact $($a.name) ($([math]::Round($a.size_in_bytes / 1MB)) MB)"  # ASCII: Windows PowerShell 5.1 reads inline scripts as ANSI
          }

      - name: Тесты Pester
        run: |
          Install-Module Pester -Scope CurrentUser -MinimumVersion 5.5 -Force -SkipPublisherCheck
          $r = Invoke-Pester installer/windows/tests -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }

      - name: Kladez.exe и его тесты
        run: |
          installer/windows/launcher/build-launcher.ps1 -Test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          installer/windows/launcher/build-launcher.ps1

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Установщик
        run: |
          installer/build.ps1 -Version $env:VERSION -Download -UpdateLock
          Get-Content installer/windows/vendor.lock
          Get-ChildItem dist | Format-Table Name, Length

      # Хранилище артефактов ~2 ГБ: по умолчанию выкладываем только установщик (~1,5–1,8 ГБ).
      - uses: actions/upload-artifact@v4
        with:
          name: kladez-installer-${{ env.VERSION }}
          path: |
            dist/Кладезъ-установка-*.exe
            dist/SHA256SUMS.txt
          retention-days: 3
          compression-level: 0

      - name: Файл обновления без интернета
        if: ${{ github.event.inputs.update_file == 'true' }}
        run: installer/build.ps1 -Version $env:VERSION -UpdateOnly

      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.update_file == 'true' }}
        with:
          name: kladez-update-${{ env.VERSION }}
          path: dist/Кладезъ-обновление-*.exe
          retention-days: 3
          compression-level: 0
